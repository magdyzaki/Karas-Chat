name: Keep Render Awake
on:
  schedule:
    - cron: '*/5 * * * *'   # كل 10 دقائق
  workflow_dispatch:          # تشغيل يدوي
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Karas Chat Backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://karas-chat-backend.onrender.com/api/health || true
